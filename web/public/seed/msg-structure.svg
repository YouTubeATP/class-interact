<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">Structure of glutamate</title>
  <desc id="d">Five-carbon chain: carboxyl group, carbon with an amino group, two CH2 groups, and a carboxylate group paired with a sodium ion.</desc>
  <rect width="640" height="400" rx="28" fill="#F5F6FA"/>
  <g stroke="#161B33" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- carbon backbone -->
    <path d="M150 250 L230 205 L310 250 L390 205 L470 250"/>
    <!-- C1: =O and -OH -->
    <path d="M150 250 L104 214"/><path d="M158 262 L112 226"/>
    <path d="M150 250 L112 298"/>
    <!-- C2: amino group -->
    <path d="M230 205 L230 128"/>
    <!-- C5: =O and -O- -->
    <path d="M470 250 L516 214"/><path d="M462 262 L508 226"/>
    <path d="M470 250 L508 298"/>
  </g>
  <!-- ionic attraction to Na+ -->
  <path d="M530 312 L566 330" stroke="#7A5CFF" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round"/>
  <g font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="30" text-anchor="middle">
    <circle cx="94" cy="204" r="22" fill="#F5F6FA"/><text x="94" y="215" fill="#E0445A">O</text>
    <circle cx="104" cy="310" r="26" fill="#F5F6FA"/><text x="98" y="321" fill="#E0445A">O</text><text x="127" y="321" fill="#161B33" font-size="26">H</text>
    <circle cx="230" cy="112" r="26" fill="#F5F6FA"/><text x="230" y="124" fill="#3347FF">NH</text><text x="263" y="132" fill="#3347FF" font-size="20">2</text>
    <circle cx="526" cy="204" r="22" fill="#F5F6FA"/><text x="526" y="215" fill="#E0445A">O</text>
    <circle cx="516" cy="310" r="26" fill="#F5F6FA"/><text x="516" y="321" fill="#E0445A">O</text><text x="540" y="304" fill="#E0445A" font-size="22">−</text>
    <circle cx="592" cy="338" r="26" fill="#E6E1FF"/><text x="588" y="349" fill="#4B33C9" font-size="26">Na</text><text x="612" y="334" fill="#4B33C9" font-size="18">+</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="22" fill="#4A5170" text-anchor="middle">
    <text x="320" y="366">HOOC–CH(NH₂)–CH₂–CH₂–COO⁻ Na⁺</text>
  </g>
</svg>
